; Medidas preventivas (CVE-2026-109618 / CVE-2026-109619)
; Se carga último en conf.d para que tenga precedencia sobre php.ini.
; memory_limit, post_max_size y upload_max_filesize se configuran en php.ini
; desde las variables de entorno PHP_* en run.sh

; Desactiva el seguimiento de progreso de uploads en la sesión
session.upload_progress.enabled = Off

; Limita el procesamiento del input de cada request
max_input_time = 60
max_input_vars = 1000
max_input_nesting_level = 64
max_file_uploads = 20
